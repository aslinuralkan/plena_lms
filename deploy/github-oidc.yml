AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC role for Plena LMS production deployments

Parameters:
  GitHubOrganization:
    Type: String
    Default: Business-Integration-Services-R-D
  GitHubRepository:
    Type: String
    Default: Plena_LMS
  GitHubEnvironment:
    Type: String
    Default: production
  ArtifactBucketName:
    Type: String
  InstanceId:
    Type: AWS::EC2::Instance::Id
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing token.actions.githubusercontent.com provider ARN, if one exists in this AWS account

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Name
          Value: plena-lms-github-actions

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege deployment role for Plena LMS GitHub Actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrganization}/${GitHubRepository}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOrganization}@*/${GitHubRepository}@*:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: UploadReleaseAndDeployWithSsm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
                Condition:
                  StringLike:
                    s3:prefix: deploy/releases/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/deploy/releases/*
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
      Tags:
        - Key: Name
          Value: plena-lms-github-deploy

Outputs:
  DeployRoleArn:
    Description: Set this as the GitHub production variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  OidcProviderArn:
    Value: !If
      - CreateOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingOidcProviderArn
